<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voices · The Toast</title>
<style>
:root{--bg:#14110f;--tile:#211b18;--line:#3b312a;--ink:#f3ebdc;--soft:#a99c8a;--gold:#e2be6a;--wine:#8f2735;
--steady:#3f7d4b;--bleed:#c98a2b;--kissed:#8d4f9e;--dead:#0c0a09;--ward:#7fc4d8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%}
.tool{container-type:size;height:100%;width:100%;padding:2.5cqmin;display:flex;flex-direction:column;gap:2cqmin;overflow:hidden}
.lab{font:700 clamp(9px,3.2cqmin,15px)/1 Georgia,serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
button{font:inherit;color:var(--ink);background:#33291f;border:1px solid var(--line);border-radius:1.6cqmin;cursor:pointer;padding:1.5cqmin 2.5cqmin;font-size:clamp(11px,4cqmin,20px);font-weight:700}
button:active{transform:scale(.97)}
button.pri{background:var(--wine);border-color:#c2485a}
button.go{background:#2f5d3a;border-color:#4d8f5c}
button.quiet{background:none;color:var(--soft);font-weight:500;font-size:clamp(10px,3cqmin,14px)}
button.on{background:var(--gold);color:#1a130c;border-color:var(--gold)}
.grow{flex:1;min-height:0}
.row{display:flex;gap:2cqmin;align-items:center}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

/* dashboard */
.dash{display:grid;height:100%;gap:6px;padding:6px;grid-template-columns:1fr 1fr 1fr 1.1fr;grid-template-rows:1fr 1.15fr;grid-template-areas:"clock knives crowd stats" "board board voice stats"}
.dash>div{background:#1a1613;border:1px solid var(--line);border-radius:8px;min-width:0;min-height:0}

/* 1 clock */
.rnum{font:700 clamp(30px,26cqmin,150px)/.9 Georgia,serif;color:var(--gold)}
.rnum small{display:block;font:700 clamp(9px,3.4cqmin,16px)/1 Georgia,serif;letter-spacing:.2em;color:var(--soft);margin-bottom:1cqmin}
.wards{display:flex;gap:1.6cqmin;justify-content:center}
.wards i{width:clamp(14px,8.5cqmin,48px);aspect-ratio:1;border-radius:50%;border:max(2px,.7cqmin) solid var(--ward);cursor:pointer}
.wards i.f{background:var(--ward);box-shadow:0 0 2cqmin #7fc4d866}
.beat{font-size:clamp(12px,5cqmin,26px);line-height:1.25;font-weight:600}
.beat.warn{color:#ff9d8f}
.cas{font-size:clamp(10px,3.4cqmin,16px);color:var(--soft)}
.cas b{color:var(--ink)}

/* 2 board */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqmin}
.board.six{grid-template-rows:1fr 1fr}
.chip{position:relative;border-radius:2cqmin;padding:2cqmin;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;min-height:0;border:max(2px,.5cqmin) solid transparent;user-select:none}
.chip.s0{background:var(--steady)} .chip.s1{background:var(--bleed);color:#1b1206} .chip.s2{background:var(--kissed)} .chip.s3{background:var(--dead);color:#6f665b;border-color:#3a322c}
.chip.prot{border-color:#fff}
.chip .n{font:700 clamp(13px,6.2cqmin,34px)/1 Georgia,serif}
.chip .h{font-size:clamp(8px,2.8cqmin,14px);opacity:.85;margin-top:.6cqmin}
.chip .st{font:800 clamp(10px,4cqmin,22px)/1 system-ui;letter-spacing:.08em;text-transform:uppercase}
.pips{display:flex;gap:1.2cqmin}
.pips i{width:clamp(10px,4.6cqmin,26px);aspect-ratio:1;border-radius:50%;border:max(2px,.5cqmin) solid #fff}
.pips i.f{background:#fff}
.chip .tools{position:absolute;top:1.2cqmin;right:1.2cqmin;display:flex;gap:1cqmin}
.chip .tools button{padding:.6cqmin 1.4cqmin;font-size:clamp(10px,3.4cqmin,18px);background:#0006;border-color:#fff5;color:#fff}
.chip .tools button.on{background:#fff;color:#111}
.chip .g{font-size:clamp(8px,2.8cqmin,14px);text-decoration:underline dotted}

/* 3 crowd */
.die{font:700 clamp(40px,34cqmin,190px)/.85 Georgia,serif;color:var(--gold)}
.cname{font:700 clamp(14px,7cqmin,38px)/1.05 Georgia,serif}
.cname.good{color:#9fd08a}.cname.bad{color:#ff9d8f}
.ctext{font-size:clamp(11px,4.4cqmin,22px);line-height:1.25}
.nums{display:grid;grid-template-columns:repeat(8,1fr);gap:1cqmin}
.nums button{padding:1.2cqmin 0}

/* 6 knives */
.kwho{font:700 clamp(18px,11cqmin,60px)/1 Georgia,serif}
.kask{font-size:clamp(12px,5cqmin,26px);line-height:1.25}
.kask b{color:var(--gold)}
.kbtns{display:grid;gap:2cqmin}
.kbtns.c3{grid-template-columns:1fr 1fr 1fr}.kbtns.c2{grid-template-columns:1fr 1fr}
.kbtns button{padding:3cqmin 1cqmin;font-size:clamp(12px,4.8cqmin,24px)}
.note{font-size:clamp(10px,3.6cqmin,17px);color:var(--gold)}
.dots{display:flex;gap:1.2cqmin;justify-content:center}
.dots i{width:clamp(6px,2.2cqmin,12px);aspect-ratio:1;border-radius:50%;background:#4a3f36}
.dots i.c{background:var(--gold)}.dots i.d{background:#7a6c5d}

/* 7 voice */
.who{font:700 clamp(11px,4.2cqmin,22px)/1.1 Georgia,serif;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.how{font-size:clamp(10px,3.4cqmin,16px);color:var(--soft);font-style:italic}
.line{font:italic 600 clamp(15px,8cqmin,44px)/1.15 Georgia,serif}

.vgrid{display:grid;gap:2cqmin;grid-template-columns:repeat(auto-fit,minmax(min(100%,max(28cqw,110px)),1fr));grid-auto-rows:1fr}
.vtile{background:var(--tile);border:1px solid var(--line);border-radius:2cqmin;padding:2.5cqmin;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:1cqmin;min-height:0;overflow:hidden}
.vtile:hover{border-color:var(--gold)}
.vn{font:700 clamp(13px,6cqmin,30px)/1.05 Georgia,serif;color:var(--gold)}
.vc{font-size:clamp(9px,3cqmin,14px);color:var(--soft);line-height:1.25}
.vname{font:700 clamp(15px,7.5cqmin,38px)/1 Georgia,serif;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:1.2cqmin}
.chips button{padding:1cqmin 2cqmin;font-size:clamp(10px,3.4cqmin,16px);font-weight:600;border-radius:99px}

.nstrip{display:flex;gap:1.5cqmin;flex-wrap:wrap}
.nstrip div{background:var(--tile);border:1px solid var(--line);border-radius:1.6cqmin;padding:1.2cqmin 2.4cqmin;font:700 clamp(14px,6.5cqmin,32px)/1 Georgia,serif;color:var(--ink);text-align:center;flex:1;min-width:max-content}
.nstrip small{display:block;font:700 clamp(8px,2.4cqmin,12px)/1 system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:.8cqmin}
.sblist{list-style:none;overflow-y:auto;display:flex;flex-direction:column;gap:1.6cqmin;font-size:clamp(12px,4.1cqmin,20px);line-height:1.3}
.sblist li{padding-left:2.4cqmin;border-left:max(2px,.5cqmin) solid var(--line)}
.sblist b{color:var(--gold)}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const KEY="toast-s12-v2";
const CH=[
 {id:"eclair",name:"Éclair",house:"Puss",def:5,shield:0,note:"Riposte: her Knife takes 9."},
 {id:"garrick",name:"Garrick",house:"Moravel",def:3,shield:2},
 {id:"noemie",name:"Noémie",house:"Vayne",def:3,shield:2},
 {id:"aurelian",name:"Aurelian",house:"Aldric",def:3,shield:2,mirror:true},
 {id:"rowan",name:"Rowan",house:"Halvenne",def:3,shield:2},
];
const STEP=["Steady","Bleeding","Kissed","Dead"];
const BEAT={0:"Opening strikes. Page cracks the shield rune. Wrent is hit.",1:"Wrent dives over a fallen champion. Corvane roars for Belaskro.",2:"Corvane hammers the dome. It holds.",
 5:"End of this round: the Knives leave.",6:"Marshals push in. End of round: last ward breaks, marksmen leave.",7:"End of this round: Cassian dies unless a PC is with him.",10:"The dome falls. Corvane runs for the stairs."};
const CROWD={1:["Surge","DC 12 Str save or pushed 10 ft toward the garden doors and prone.","bad"],2:["Trample","Each prone creature takes 7. Nobody prone? Treat as Surge.","bad"],
 3:["Clutching Noble","A noble grabs a PC. Persuasion DC 12 (bonus action) frees them.","bad"],4:["Wall of Silk","The marksmen have no shots this round.","good"],
 5:["Swallowed","A Knife vanishes. Its next strike: defense roll at disadvantage.","bad"],6:["A Lane Opens","Anyone crossing this round gets +1 box.","good"],
 7:["Brave Fool","Next attack on a Knife of the players' choice has advantage.","good"],8:["Panic up the Stair","One extra ward breaks.","bad"]};
const CASLINE={5:"FATHER! Someone's on the roof!",4:"Is that all you've got?",3:"He's not angry. He's just counting.",2:"…Father?"};
const NUMW=["","One.","Two.","Three.","Four.","Five.","Six."];

function fresh(){return {round:0,wards:6,engaged:false,cas:"up",
 ch:CH.map(c=>({id:c.id,step:0,pips:3,prot:false,shield:c.shield,mirror:!!c.mirror,knife:true})),
 wrent:{step:1,pips:3,prot:false,guard:""},crowd:0,ki:0,klast:"",vi:0};}
let mem=null,hist=[],bc=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return mem||fresh();}
function save(s){mem=s;try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}try{bc&&bc.postMessage(1);}catch(e){}}
try{bc=new BroadcastChannel(KEY);bc.onmessage=()=>render();}catch(e){}
window.addEventListener("storage",e=>{if(e.key===KEY)render();});
let S=load();
function mut(fn){hist.push(JSON.stringify(S));if(hist.length>60)hist.shift();try{localStorage.setItem(KEY+"-h",JSON.stringify(hist.slice(-20)));}catch(e){}S=load();fn(S);save(S);render();}
function undo(){let h=hist;try{const r=localStorage.getItem(KEY+"-h");if(r)h=JSON.parse(r);}catch(e){}if(!h.length)return;S=JSON.parse(h.pop());hist=h;try{localStorage.setItem(KEY+"-h",JSON.stringify(h));}catch(e){}save(S);render();}
const def=id=>CH.find(c=>c.id===id), st=(s,id)=>s.ch.find(c=>c.id===id);
const guarded=(s,c)=>c.prot||(s.wrent.guard===c.id&&s.wrent.step<2);

/* ----- rules ----- */
function right(o){if(o.step<3){o.step++;if(o.step===2)o.pips=3;}}
function endRound(s){const r=s.round;
 if(r>=1){
  if(!s.engaged&&s.wards>0)s.wards--;
  s.ch.forEach(c=>{if(c.step===2&&guarded(s,c)){c.pips--;if(c.pips<=0)c.step=3;}});
  if(s.wrent.step===2&&s.wrent.prot){s.wrent.pips--;if(s.wrent.pips<=0){s.wrent.step=3;s.wrent.guard="";}}
  if(r>=5)s.ch.forEach(c=>c.knife=false);
  if(r>=7&&s.cas==="kissed"&&!s.engaged)s.cas="dead";
 }
 if(s.wards===0&&s.cas==="up")s.cas="kissed";
 s.ch.forEach(c=>{if(c.step===3)c.knife=false;});
 s.round++;s.crowd=0;s.ki=0;s.klast="";}
function queue(s){return s.round===0?s.ch.map(c=>c.id):s.ch.filter(c=>c.knife&&c.step<3).map(c=>c.id);}
function strike(s,id,res){const c=st(s,id),d=def(id);let msg="";
 const viaW=s.round>0&&s.wrent.guard===id&&s.wrent.step<3, o=viaW?s.wrent:c, nm=viaW?"Wrent":d.name;
 if(s.round===0){c.step=res==="pass"?1:2;c.pips=3;msg=d.name+": "+STEP[c.step]+".";}
 else if(res==="gone"){c.knife=false;msg=d.name+"'s Knife is out of the fight.";}
 else if(res==="pc"){msg="Knife went for the PC guarding "+nm+".";}
 else if(res==="dead"){o.step=3;if(viaW){s.wrent.guard="";msg="Wrent is dead. Handler signal lost.";}else{c.knife=false;msg=d.name+" is dead. Say the name.";}}
 else if(res==="def"){msg=nm+" defends."+(!viaW&&d.note?" "+d.note:"");}
 else if(res==="nat"){msg=nm+" counters. The Knife is prone."+(!viaW&&d.note?" "+d.note:"");}
 else if(res==="shield"){c.shield--;msg=d.name+" casts Shield: +5 to that roll. Now choose the result.";s.klast=msg;return;}
 else if(res==="fail"){if(!viaW&&c.mirror){c.mirror=false;msg="Mirror Mantle absorbs it. Aurelian is unharmed.";}else{right(o);msg=nm+" → "+STEP[o.step]+".";}}
 s.klast=msg;if(queue(s).indexOf(id)>=0||s.round===0)s.ki++;}

/* ----- views ----- */
const V={};
V.clock=()=>{const r=S.round;let beat=BEAT[r]||"",warn=false;
 const dying=S.ch.filter(c=>c.step===2&&!guarded(S,c)&&c.knife).map(c=>def(c.id).name);
 if(S.wrent.step===2&&!S.wrent.prot)dying.push("Wrent");
 if(r>0&&dying.length){beat=dying.join(", ")+(dying.length>1?" are":" is")+" down and alone.";warn=true;}
 let w="";for(let i=1;i<=6;i++)w+=`<i class="${i<=S.wards?"f":""}" data-a="ward" data-v="${i}"></i>`;
 const cas=S.cas==="dead"?"<b>Cassian is dead.</b>":S.cas==="kissed"?"<b>Cassian is Kissed.</b>":S.engaged?"<b>A PC is with Cassian. Clock stopped.</b>":`Cassian holds · dome ${r>10?"down":r===10?"falls now":(10-r)+" left"}`;
 return `<div class="tool"><div class="row"><span class="lab">Round clock</span><span class="grow"></span><button class="quiet" data-a="undo">Undo</button></div>
 <div class="grow center" style="gap:2.5cqmin"><div class="rnum"><small>ROUND</small>${r}</div><div class="wards">${w}</div><div class="cas">${cas}</div><div class="beat ${warn?"warn":""}">${beat}</div></div>
 <div class="row"><button class="${S.engaged?"on":""}" data-a="eng" style="flex:1">PC with Cassian</button><button class="pri" data-a="end" style="flex:1.4">End round →</button></div>
 <div class="row"><span class="grow"></span><button class="quiet" data-a="reset">Reset fight (double tap)</button></div></div>`;};

function chip(id,o,name,house,extra){const p=o.step===2?`<div class="pips">${[1,2,3].map(i=>`<i class="${i<=o.pips?"f":""}" data-a="pip" data-s="${id}" data-v="${i}"></i>`).join("")}</div>`:"";
 return `<div class="chip s${o.step} ${o.prot?"prot":""}" data-a="step" data-s="${id}"><div class="tools"><button data-a="back" data-s="${id}">◀</button><button class="${o.prot?"on":""}" data-a="prot" data-s="${id}" title="A PC is protecting">🛡</button></div>
 <div><div class="n">${name}</div><div class="h">${house}</div>${extra||""}</div><div class="row" style="justify-content:space-between"><span class="st">${STEP[o.step]}</span>${p}</div></div>`;}
V.board=()=>{const g=S.wrent.guard;
 return `<div class="tool"><div class="row"><span class="lab">Champions</span><span class="grow"></span><span class="lab" style="color:var(--soft);letter-spacing:.04em;text-transform:none;font-family:system-ui;font-weight:500">tap = worse · ◀ = better · 🛡 = PC protecting</span></div>
 <div class="board six grow">${S.ch.map(c=>{const d=def(c.id);return chip(c.id,c,d.name,d.house+(g===c.id&&S.wrent.step<3?" · Wrent guarding":""));}).join("")}
 ${chip("wrent",S.wrent,"Wrent","Gus's handler",`<div class="g" data-a="guard">guarding: ${g?def(g).name:"nobody"} ↻</div>`)}</div></div>`;};

V.crowd=()=>{const c=CROWD[S.crowd];
 return `<div class="tool"><div class="row"><span class="lab">The crowd · init 10</span></div>
 <div class="grow center" style="gap:2cqmin">${c?`<div class="die">${S.crowd}</div><div class="cname ${c[2]}">${c[0]}</div><div class="ctext">${c[1]}</div>`:`<div class="die" style="opacity:.25">d8</div><div class="ctext" style="color:var(--soft)">Roll openly, then tap the number.</div>`}</div>
 <div class="nums">${[1,2,3,4,5,6,7,8].map(n=>`<button class="${S.crowd===n?"on":""}" data-a="crowd" data-v="${n}">${n}</button>`).join("")}</div>
 <button class="pri" data-a="croll">Roll d8</button></div>`;};

V.knives=()=>{const q=queue(S),r=S.round,i=S.ki;
 const head=`<div class="row"><span class="lab">${r===0?"Opening strikes":"Knives' turn"}</span><span class="grow"></span><div class="dots">${q.map((x,k)=>`<i class="${k===i?"c":k<i?"d":""}"></i>`).join("")}</div></div>`;
 const last=S.klast?`<div class="note">${S.klast}</div>`:"";
 if(!q.length)return `<div class="tool">${head}<div class="grow center"><div class="kask">No Knives left on the floor.</div></div></div>`;
 if(i>=q.length)return `<div class="tool">${head}<div class="grow center" style="gap:3cqmin">${last}<div class="kask">${r===0?"All five struck. End the round to begin Round 1.":"Knives' turn done. End the round on the clock."}</div></div><button class="quiet" data-a="kagain">Run it again</button></div>`;
 const id=q[i],c=st(S,id),d=def(id);let who=d.name,ask,btns;
 if(r===0){ask=`${d.name}'s player rolls a <b>DC 16 Con</b> save (Con ${id==="eclair"?"+3":"+5"}).`;btns=`<div class="kbtns c2"><button class="go" data-a="k" data-v="pass">Passed · Bleeding</button><button class="pri" data-a="k" data-v="fail0">Failed · Kissed</button></div>`;}
 else{const viaW=S.wrent.guard===id&&S.wrent.step<3,o=viaW?S.wrent:c,bonus=viaW?4:d.def,pl=viaW?"Gus's player":"Their player";
  who=viaW?"Wrent":d.name;const sub=viaW?` <span style="font-size:.5em;color:var(--soft)">over ${d.name}</span>`:"";who+=sub;
  if(o.prot){ask=`A PC is in the way. That PC rolls <b>d20 + (AC − 10)</b> vs <b>DC 18</b>, twice. <b>13</b> each on a fail.`;btns=`<div class="kbtns c2"><button data-a="k" data-v="pc">Done · next</button><button data-a="k" data-v="gone">Knife is gone</button></div>`;}
  else if(o.step===2){ask=`Down and alone. The Knife finishes ${viaW?"him":"them"} unless someone stepped in.`;btns=`<div class="kbtns c2"><button class="pri" data-a="k" data-v="dead">Dead</button><button data-a="k" data-v="gone">Knife is gone</button></div>`;}
  else{ask=`${pl} rolls <b>d20 + ${bonus}</b> vs <b>DC 18</b>.`;btns=`<div class="kbtns c3"><button class="go" data-a="k" data-v="def">Defended</button><button class="pri" data-a="k" data-v="fail">Failed</button><button data-a="k" data-v="nat">Nat 20</button></div>
   <div class="row">${!viaW&&c.shield>0?`<button class="quiet" data-a="k" data-v="shield">Shield +5 (${c.shield} left)</button>`:""}<span class="grow"></span><button class="quiet" data-a="k" data-v="gone">Knife is gone</button></div>`;}}
 return `<div class="tool">${head}<div class="grow center" style="gap:2.5cqmin">${last}<div class="kwho">${who}</div><div class="kask">${ask}</div></div>${btns}</div>`;};


let VO={"title":"The Toast","groups":[{"name":"The Dais","chars":[{"name":"Corvane","cue":"Gravelly, deliberate. Serious to roaring in three seconds.","beats":[{"beat":"Belaskro","lines":["BELASKRO. MY SON.","Nephew. The stairs. NOW.","You are blood. Act like it."]},{"beat":"Each bell","lines":["Five.","Four.","Three.","Two.","One."]},{"beat":"Champion falls","lines":["Someone stand over that child!","On your feet, girl. Not in my house."]},{"beat":"To the Queen","lines":["Your toast, Majesty.","You're very calm.","If he dies, Majesty, we will talk. At length."]},{"beat":"Frustration","lines":["OPEN.","I built this house to keep knives out."]},{"beat":"After","lines":["I gave no such order.","Now get out of my house."]}]},{"name":"Queen Sabine","cue":"British, graceful. More gracious the worse it gets.","beats":[{"beat":"The toast","lines":["Alive. I'll want to know who sent him."]},{"beat":"To Corvane","lines":["It's a shield rune, Marquis. It was meant to keep us safe.","Do stop striking it. You'll only tire.","We are both of us parents tonight, Marquis."]},{"beat":"Shaken","lines":["How many of them were there?","(says nothing, glass still in hand)"]},{"beat":"To a PC","lines":["Whoever you are, the Crown is in your debt. Hurry."]},{"beat":"After","lines":["I gave that toast. I will not let anyone pretend it was mine.","The Marshals will have everything I can give them."]}]},{"name":"The page","cue":"Young, shaking, exalted. Unbowed.","beats":[{"beat":"The toast","lines":["UNBOWED!","Kneel on me all you like."]},{"beat":"Watching","lines":["Look at them run. Look at them.","No houses. No crowns."]},{"beat":"Questioned","lines":["You'll get my name and nothing else."]}]}]},{"name":"Champions","chars":[{"name":"Éclair","cue":"Clipped, competitive. Allergic to being fussed over.","beats":[{"beat":"Combat","lines":["Point.","You're telegraphing.","Again. Slower, so I can enjoy it."]},{"beat":"Hurt","lines":["It's a scratch. Don't fuss.","I said don't fuss. Get the kn  C unsealed."]},{"beat":"Grief","lines":["Unclassified sensation detected. Note the time. Continue."]}]}]},{"name":"Killers","chars":[{"name":"A Knife","cue":"Flat, professional. One mark, nothing personal.","beats":[{"beat":"To a PC","lines":["Let go. You're not the one I'm here for.","Step aside. This isn't yours."]},{"beat":"Grappled","lines":["Hand. Off. Now."]},{"beat":"Captured","lines":["My mark. My signal. My exit. That's all there is."]}]},{"name":"The Hand","cue":"Patient, unhurried. Trusts the count.","beats":[{"beat":"At the wards","lines":["Four left, my lord. No hurry."]},{"beat":"A PC arrives","lines":["You're not on the contract. Leave and I'll forget you.","Ah. Finally, some work."]},{"beat":"Hurt","lines":["Noted."]},{"beat":"Leaving","lines":["Another night, then."]}]},{"name":"A marksman","cue":"Sharp, from the loggia rail.","beats":[{"beat":"Overwatch","lines":["Clear of him, or you're next!","Off the mark!"]},{"beat":"Leaving","lines":["Tablets. Go."]}]}]},{"name":"Guests","chars":[{"name":"Honey Cruller","cue":"Unhurried, immaculately polite. The knife lands in the second half.","beats":[{"beat":"Éclair in danger","lines":["My daughter is on that floor, and you are standing here.","We are guests. Guests, it seems, are stabbed."]},{"beat":"To Timbit","lines":["Niece. Bring her back, and Meow will remember it."]},{"beat":"After: she lived","lines":["Meow remembers a courtesy. I shall remember this one personally."]},{"beat":"After: she died","lines":["I will have a name. I am very patient."]}]},{"name":"Tasmin Dreveth","cue":"In her chair. Spared, and knows it.","beats":[{"beat":"Realising","lines":["Why not me? Why did they walk past me?"]},{"beat":"Panic","lines":["I can't get up. Somebody, I can't get up."]},{"beat":"To Timbit","lines":["Go! I'm the only safe one here!"]}]},{"name":"Lady Odile","cue":"Rowan's sister. Composed until tonight.","beats":[{"beat":"Rowan","lines":["Rowan! ROWAN!","He's an idiot but he's my idiot. Please!"]}]},{"nam
