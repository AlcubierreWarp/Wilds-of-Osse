name: Build homebrew

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/build.py'
      - '.github/workflows/build-homebrew.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build combined brew
        run: python tools/build.py

      - name: Validate output
        run: python -c "import json; d=json.load(open('wilds-of-osse.json')); print(len(d.get('monster',[])), 'creatures'); assert d['_meta']['sources']"

      - name: Commit if changed
        run: |
          if git diff --quiet -- wilds-of-osse.json; then
            echo "No change to wilds-of-osse.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wilds-of-osse.json
          git commit -m "Rebuild wilds-of-osse.json [skip ci]"
          git push
